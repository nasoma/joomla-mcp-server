[project]
name = "joomlamcp"
version = "0.1.0"
description = "MCP Server to create articles on a Joomla website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "bleach>=6.4.0",
    "httpx>=0.28.1",
    "markdown>=3.11",
    "mcp[cli]>=2.3.0,<3",
]

[tool.black]
target-version = ["py314"]
