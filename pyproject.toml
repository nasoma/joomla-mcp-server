[project]
name = "joomlamcp"
version = "0.2.0"
description = "MCP server for guarded Joomla 4/5 content and site management"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bleach>=6.4.0",
    "httpx>=0.28.1",
    "markdown>=3.11",
    "pydantic>=2.13.5,<3",
    "pillow>=12",
    "mcp>=2.3.0,<3",
]

[tool.black]
target-version = ["py314"]

[dependency-groups]
dev = ["black>=26.5.1", "pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
joomla-mcp = "joomlamcp.server:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["joomlamcp"]
