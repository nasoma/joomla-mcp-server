# Stdio deployment contract; runtime validates configuration independently.
startCommand:
  type: stdio
  commandFunction: |-
    (config) => ({ command: 'joomla-mcp', args: [], env: {
      JOOMLA_BASE_URL: config.joomlaBaseUrl,
      BEARER_TOKEN: config.bearerToken,
      JOOMLA_VERSION: String(config.joomlaVersion ?? '5'),
      JOOMLA_READ_ONLY: String(config.readOnly ?? false),
      JOOMLA_ALLOW_TRUSTED_HTML: String(config.allowTrustedHtml ?? false),
      JOOMLA_ENABLE_USERS: String(config.enableUsers ?? false)
    } })
  configSchema:
    type: object
    additionalProperties: false
    required: [joomlaBaseUrl, bearerToken]
    properties:
      joomlaBaseUrl:
        type: string
        format: uri
        minLength: 1
        pattern: '^https://'
        description: HTTPS Joomla site root, without credentials, query or fragment
      bearerToken:
        type: string
        minLength: 1
        pattern: '^\S+$'
        writeOnly: true
        description: Secret Joomla API token; provide through secure deployment configuration
      joomlaVersion:
        type: string
        enum: ['4', '5']
        default: '5'
      readOnly:
        type: boolean
        default: false
        description: Reject all writes before any API request
      allowTrustedHtml:
        type: boolean
        default: false
        description: Permit explicitly selected trusted_html mode for approved source content
      enableUsers:
        type: boolean
        default: false
        description: Enable user reads with sensitive attributes excluded
  exampleConfig:
    joomlaBaseUrl: https://example.com
    bearerToken: replace-with-your-api-token
    readOnly: true
